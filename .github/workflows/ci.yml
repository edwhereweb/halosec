name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/php-cs-fixer fix src/ --dry-run --diff --allow-risky=yes
      - run: vendor/bin/phpstan analyse src tests --level=8
      - run: vendor/bin/phpunit
      # public/css/app.css is committed because Hostinger runs no build step; fail if it is stale.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code public/css/app.css || (echo "public/css/app.css is out of date. Run npm run build and commit it." && exit 1)
