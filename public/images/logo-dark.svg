<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 42" fill="none" class="halosec-logo-dark">
  <defs>
    <linearGradient id="haloRingDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="1" />
    </linearGradient>
    <filter id="haloGlowDark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luminous Cyan Halo Aura Ring -->
  <ellipse cx="36" cy="21" rx="19" ry="18" stroke="url(#haloRingDark)" stroke-width="2.5" fill="none" opacity="0.9" filter="url(#haloGlowDark)" />

  <!-- "halo" in vibrant bright royal/sky blue -->
  <text x="7" y="28" font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.03em" fill="#38bdf8">halo</text>

  <!-- "sec" in crisp pure white -->
  <text x="61" y="28" font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.03em" fill="#ffffff">sec</text>
</svg>
